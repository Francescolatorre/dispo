name: Backend Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: dispomvp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dispomvp_test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: dispomvp_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          echo "Checking if backend coverage is at least 50%..."
          node -e "
          const coverage = require('./coverage/coverage-summary.json');
          const total = coverage.total;
          const statements = total.lines.pct;
          console.log(\`Backend Coverage: \${statements}%\`);
          if (statements < 50) {
            console.error('Coverage is below 50%');
            process.exit(1);
          }
          console.log('Coverage check passed!');
          "
        continue-on-error: true
