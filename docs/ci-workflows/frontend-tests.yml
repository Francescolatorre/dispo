name: Frontend Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --coverage --run

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./client/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          echo "Checking if frontend coverage is at least 50%..."
          node -e "
          const fs = require('fs');
          const coveragePath = './coverage/coverage-summary.json';
          if (!fs.existsSync(coveragePath)) {
            console.log('No coverage file found, skipping check');
            process.exit(0);
          }
          const coverage = require(coveragePath);
          const total = coverage.total;
          const statements = total.lines.pct;
          console.log(\`Frontend Coverage: \${statements}%\`);
          if (statements < 50) {
            console.error('Coverage is below 50%');
            process.exit(1);
          }
          console.log('Coverage check passed!');
          "
        continue-on-error: true
